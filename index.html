
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        transition: opacity 0.3s;
      }
      #controls.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #recordingControls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: none;
      }
      #recordingControls.show {
        display: block;
      }
      button {
        padding: 10px 20px;
        margin: 0 5px;
        font-size: 16px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #45a049;
      }
      button.recording {
        background-color: #f44336;
      }
      button.recording:hover {
        background-color: #da190b;
      }
    </style>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./squeezer.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="squeezerVideo" src="./squeezerVideo.mp4" autoplay loop muted playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#squeezerVideo" position="0 0 0.05" height="0.552" width="1" rotation="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <div id="controls">
      <button onclick="playVideo()">Play</button>
      <button onclick="pauseVideo()">Pause</button>
      <button onclick="takePhoto()">📷 Photo</button>
      <button onclick="toggleRecording()">🔴 Record</button>
    </div>

    <div id="recordingControls">
      <button class="recording" onclick="stopRecording()">⏹️ Stop Recording</button>
    </div>

    <script>
      const video = document.getElementById('squeezerVideo');
      const controls = document.getElementById('controls');
      const recordingControls = document.getElementById('recordingControls');
      let mediaRecorder;
      let recordedChunks = [];
      let isRecording = false;
      let canvasStream;

      function playVideo() {
        video.play();
      }

      function pauseVideo() {
        video.pause();
      }

      // Take Photo
      function takePhoto() {
        controls.classList.add('hidden');
        
        requestAnimationFrame(() => {
          setTimeout(() => {
            const scene = document.querySelector('a-scene');
            const renderer = scene.renderer;
            
            const canvas = document.createElement('canvas');
            canvas.width = renderer.domElement.width;
            canvas.height = renderer.domElement.height;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(renderer.domElement, 0, 0);
            
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'julius-squeezer-' + Date.now() + '.png';
            link.click();
            
            controls.classList.remove('hidden');
          }, 50);
        });
      }

      // Toggle Video Recording
      function toggleRecording() {
        startRecording();
      }

      function startRecording() {
        controls.classList.add('hidden');
        recordingControls.classList.add('show');
        
        isRecording = true;
        recordedChunks = [];
        
        try {
          const scene = document.querySelector('a-scene');
          const renderer = scene.renderer;
          
          // Create canvas stream from the renderer
          if (renderer.domElement.captureStream) {
            canvasStream = renderer.domElement.captureStream(30);
            createMediaRecorder(canvasStream);
          } else {
            // Fallback for browsers that don't support captureStream
            alert('Video recording not supported on this device/browser. Try using Chrome or Firefox.');
            controls.classList.remove('hidden');
            recordingControls.classList.remove('show');
          }
        } catch (e) {
          console.error('Recording error:', e);
          alert('Could not start recording: ' + e.message);
          controls.classList.remove('hidden');
          recordingControls.classList.remove('show');
        }
      }

      function createMediaRecorder(stream) {
        const options = { 
          mimeType: 'video/webm'
        };
        
        // Check if the mimeType is supported
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options.mimeType = 'video/webm;codecs=vp8';
        }
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options.mimeType = 'video/webm;codecs=vp9';
        }
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options.mimeType = 'video/webm;codecs=h264';
        }
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options.mimeType = '';
        }
        
        mediaRecorder = new MediaRecorder(stream, options);
        
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };
        
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'julius-squeezer-' + Date.now() + '.webm';
          link.click();
          URL.revokeObjectURL(url);
        };
        
        mediaRecorder.start();
      }

      function stopRecording() {
        isRecording = false;
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        if (canvasStream) {
          canvasStream.getTracks().forEach(track => track.stop());
        }
        recordingControls.classList.remove('show');
        controls.classList.remove('hidden');
      }

      video.autoplay = true;
    </script>
  </body>
</html>
