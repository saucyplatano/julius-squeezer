<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        transition: opacity 0.3s;
      }
      #controls.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #recordingControls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: none;
      }
      #recordingControls.show {
        display: block;
      }
      button {
        padding: 10px 20px;
        margin: 0 5px;
        font-size: 16px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #45a049;
      }
      button.recording {
        background-color: #f44336;
      }
      button.recording:hover {
        background-color: #da190b;
      }
    </style>
  </head>
  <body>
    <!-- Fixed A-Frame scene initialization parameters -->
    <a-scene mindar-image="imageTargetSrc: ./squeezer.mind;" color-space="sRGB" renderer="colorManagement: true; preserveDrawingBuffer: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="squeezerVideo" src="./squeezerVideo.mp4" autoplay loop muted playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <a-plane src="#squeezerVideo" position="0 0 0.05" height="0.552" width="1" rotation="0 0 0"></a-plane>
      
    </a-scene>

    <div id="controls">
      <button onclick="playVideo()">Play</button>
      <button onclick="pauseVideo()">Pause</button>
      <button onclick="takePhoto()">📷 Photo</button>
      <button onclick="toggleRecording()">🔴 Record</button>
    </div>

    <div id="recordingControls">
      <button class="recording" onclick="stopRecording()">⏹️ Stop Recording</button>
    </div>

    <script>
      const video = document.getElementById('squeezerVideo');
      const controls = document.getElementById('controls');
      const recordingControls = document.getElementById('recordingControls');
      let mediaRecorder;
      let recordedChunks = [];
      let isRecording = false;
      let recordingAnimationId;

      // Re-usable offscreen workspace to prevent mobile crashes
      const sharedCanvas = document.createElement('canvas');
      const sharedCtx = sharedCanvas.getContext('2d');

      function playVideo() {
        video.play();
      }

      function pauseVideo() {
        video.pause();
      }

      // Safe, robust video acquisition utility targeting MindAR's device stream
      function getMindARVideo() {
        // Find the specific auto-generated device video tag container injected by MindAR
        return Array.from(document.querySelectorAll('video')).find(v => v.srcObject !== null && v.id !== 'squeezerVideo');
      }

      // Builds the canvas data layer directly into the destination context
      function renderCompositeFrame(targetCtx, targetWidth, targetHeight) {
        const scene = document.querySelector('a-scene');
        const arCanvas = scene.canvas;
        const mindArVideo = getMindARVideo();

        // Layer 1: Live background environment camera
        if (mindArVideo) {
          targetCtx.drawImage(mindArVideo, 0, 0, targetWidth, targetHeight);
        } else {
          targetCtx.fillStyle = '#000000';
          targetCtx.fillRect(0, 0, targetWidth, targetHeight);
        }

        // Layer 2: Core 3D items from the WebGL context
        if (arCanvas) {
          targetCtx.drawImage(arCanvas, 0, 0, targetWidth, targetHeight);
        }
      }

      // Snapshot capture function
      function takePhoto() {
        controls.classList.add('hidden');
        
        setTimeout(() => {
          try {
            const scene = document.querySelector('a-scene');
            const arCanvas = scene.canvas;
            const mindArVideo = getMindARVideo();

            // Set size using native camera resolution if available, otherwise fall back to viewport size
            const outputWidth = mindArVideo ? mindArVideo.videoWidth : arCanvas.width;
            const outputHeight = mindArVideo ? mindArVideo.videoHeight : arCanvas.height;

            sharedCanvas.width = outputWidth;
            sharedCanvas.height = outputHeight;

            renderCompositeFrame(sharedCtx, outputWidth, outputHeight);
            
            const link = document.createElement('a');
            link.href = sharedCanvas.toDataURL('image/jpeg', 0.9);
            link.download = 'julius-squeezer-' + Date.now() + '.jpg';
            link.click();
            
            controls.classList.remove('hidden');
          } catch (e) {
            console.error('Photo error:', e);
            controls.classList.remove('hidden');
          }
        }, 150); // Slight delay allowing DOM changes to settle
      }

      function toggleRecording() {
        startRecording();
      }

      function startRecording() {
        controls.classList.add('hidden');
        recordingControls.classList.add('show');
        
        isRecording = true;
        recordedChunks = [];
        
        try {
          const scene = document.querySelector('a-scene');
          const arCanvas = scene.canvas;
          const mindArVideo = getMindARVideo();
          
          const recordCanvas = document.createElement('canvas');
          // Match recording format precisely to live rendering dimensions
          recordCanvas.width = mindArVideo ? mindArVideo.videoWidth : arCanvas.width;
          recordCanvas.height = mindArVideo ? mindArVideo.videoHeight : arCanvas.height;
          const recordCtx = recordCanvas.getContext('2d');
          
          const canvasStream = recordCanvas.captureStream(30);
          
          // Switch between mobile supported formats seamlessly (Safari vs Chrome)
          const supportedMime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
          const fileExtension = supportedMime === 'video/mp4' ? 'mp4' : 'webm';
          
          mediaRecorder = new MediaRecorder(canvasStream, { mimeType: supportedMime });
          
          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              recordedChunks.push(event.data);
            }
          };
          
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: supportedMime });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'julius-squeezer-' + Date.now() + '.' + fileExtension;
            link.click();
            URL.revokeObjectURL(url);
          };
          
          mediaRecorder.start();
          
          // High-efficiency game-loop layer draw cycle
          function drawFrame() {
            if (!isRecording) return;
            renderCompositeFrame(recordCtx, recordCanvas.width, recordCanvas.height);
            recordingAnimationId = requestAnimationFrame(drawFrame);
          }
          
          drawFrame();
          
        } catch (e) {
          console.error('Recording error:', e);
          alert('Could not start recording: ' + e.message);
          controls.classList.remove('hidden');
          recordingControls.classList.remove('show');
          isRecording = false;
        }
      }

      function stopRecording() {
        isRecording = false;
        cancelAnimationFrame(recordingAnimationId);
        
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        
        recordingControls.classList.remove('show');
        controls.classList.remove('hidden');
      }

      video.autoplay = true;
    </script>
  </body>
</html>
