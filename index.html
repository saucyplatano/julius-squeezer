<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindAR WebAR Experience</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        transition: opacity 0.3s;
      }
      #controls.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #recordingControls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: none;
      }
      #recordingControls.show {
        display: block;
      }
      button {
        padding: 10px 20px;
        margin: 0 5px;
        font-size: 16px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #45a049;
      }
      button.recording {
        background-color: #f44336;
      }
      button.recording:hover {
        background-color: #da190b;
      }

      /* Camera Shutter Flash Effect Overlay */
      #flash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease-out;
      }

      /* Live Recording Timer Text */
      #recordTimer {
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
        vertical-align: middle;
        margin-left: 10px;
        display: inline-block;
        font-variant-numeric: tabular-nums;
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 6px;
        border-radius: 3px;
      }

      #introOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.6s ease;
      }

      #introOverlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #introVideo {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #skipIntroBtn {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 2001;
        background: rgba(0, 0, 0, 0.5);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 14px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        transition: background-color 0.2s;
      }

      #skipIntroBtn:hover {
        background: rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="introOverlay">
      <video id="introVideo" src="./globalvisionintro.mp4" autoplay muted playsinline></video>
      <button id="skipIntroBtn" onclick="closeIntro()">Skip ⏭</button>
    </div>

    <!-- ===== DO NOT MODIFY THIS SECTION ===== -->
    <!-- A-Frame Scene: Image tracking and AR setup -->
    <a-scene
      mindar-image="imageTargetSrc: ./squeezer.mind;"
      color-space="sRGB"
      renderer="preserveDrawingBuffer: true; colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="squeezerVideo" src="./squeezerVideo.mp4" autoplay loop muted playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#squeezerVideo" position="0 0 0.05" height="0.552" width="1" rotation="0 0 0" material="shader: flat;"></a-plane>
      </a-entity>
    </a-scene>
    <!-- ===== END: DO NOT MODIFY ===== -->

    <!-- ===== YOU CAN MODIFY: UI Controls ===== -->
    <div id="controls" class="hidden">
      <button id="playPauseBtn" onclick="toggleVideo()">⏸ Pause</button>
      <button onclick="takePhoto()">📷 Photo</button>
      <button onclick="toggleRecording()">🔴 Record</button>
    </div>

    <div id="recordingControls">
      <button class="recording" onclick="stopRecording()">
        ⏹️ Stop Recording <span id="recordTimer">00:00</span>
      </button>
    </div>
    <!-- ===== END: UI Controls ===== -->

    <script>
      // ===== CORE VARIABLES (DO NOT MODIFY) =====
      const video = document.getElementById('squeezerVideo');
      const controls = document.getElementById('controls');
      const recordingControls = document.getElementById('recordingControls');
      let mediaRecorder;
      let recordedChunks = [];
      let isRecording = false;
      let recordingAnimationId;
      // ===== END: CORE VARIABLES =====

      const introOverlay = document.getElementById('introOverlay');
      const introVideo = document.getElementById('introVideo');
      let introClosed = false;

      function closeIntro() {
        if (introClosed) return;
        introClosed = true;

        introOverlay.classList.add('fade-out');
        setTimeout(() => {
          introVideo.pause();
          introOverlay.style.display = 'none';
          controls.classList.remove('hidden');
        }, 600);
      }

      if (introVideo) {
        // Force muted state via JS to satisfy strict Firefox/Safari autoplay rules
        introVideo.muted = true;

        // Auto-close overlay when video reaches end
        introVideo.addEventListener('ended', closeIntro);

        // Mobile & Firefox autoplay fallback check
        const playPromise = introVideo.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            const startIntroOnTouch = () => {
              introVideo.play();
              document.removeEventListener('click', startIntroOnTouch);
              document.removeEventListener('touchstart', startIntroOnTouch);
            };
            document.addEventListener('click', startIntroOnTouch);
            document.addEventListener('touchstart', startIntroOnTouch);
          });
        }
      }

      // Track the timer interval externally
      let timerInterval;

      // ===== VIDEO PLAYBACK FUNCTIONS (SAFE TO MODIFY) =====
      function toggleVideo() {
        const btn = document.getElementById('playPauseBtn');
        if (video.paused) {
          video.play();
          btn.innerText = "⏸ Pause";
        } else {
          video.pause();
          btn.innerText = "▶ Play";
        }
      }
      // ===== END: VIDEO PLAYBACK FUNCTIONS =====

      // ===== CAPTURE ENGINE (DO NOT MODIFY - Technical) =====
      function getMindARVideo() {
        return Array.from(document.querySelectorAll('video')).find(v => v.srcObject !== null && v.id !== 'squeezerVideo');
      }

      function mergeCanvases() {
        try {
          const scene = document.querySelector('a-scene');
          if (!scene || !scene.renderer) return null;

          const arCanvas = scene.renderer.domElement;
          const mindArVideo = getMindARVideo();

          const mergedCanvas = document.createElement('canvas');
          mergedCanvas.width = arCanvas.width;
          mergedCanvas.height = arCanvas.height;
          const ctx = mergedCanvas.getContext('2d');

          if (mindArVideo && mindArVideo.readyState === mindArVideo.HAVE_ENOUGH_DATA) {
            const vWidth = mindArVideo.videoWidth;
            const vHeight = mindArVideo.videoHeight;
            const targetRatio = arCanvas.width / arCanvas.height;
            const videoRatio = vWidth / vHeight;

            let drawWidth, drawHeight, offsetX, offsetY;

            if (videoRatio > targetRatio) {
              drawHeight = arCanvas.height;
              drawWidth = arCanvas.height * videoRatio;
              offsetX = (arCanvas.width - drawWidth) / 2;
              offsetY = 0;
            } else {
              drawWidth = arCanvas.width;
              drawHeight = arCanvas.width / videoRatio;
              offsetX = 0;
              offsetY = (arCanvas.height - drawHeight) / 2;
            }

            ctx.drawImage(mindArVideo, offsetX, offsetY, drawWidth, drawHeight);
          } else {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, mergedCanvas.width, mergedCanvas.height);
          }

          // Overlay AR canvas directly from WebGL buffer
          ctx.drawImage(arCanvas, 0, 0);

          return mergedCanvas;
        } catch (e) {
          console.error('Merge error:', e);
          return null;
        }
      }
      // ===== END: CAPTURE ENGINE =====

      // ===== PHOTO & VIDEO FUNCTIONS (SAFE TO MODIFY FOR UI FLOW) =====
      function takePhoto() {
        controls.classList.add('hidden');

        const flash = document.createElement('div');
        flash.id = 'flash-overlay';
        document.body.appendChild(flash);
        requestAnimationFrame(() => {
          flash.style.opacity = '1';
          setTimeout(() => {
            flash.style.opacity = '0';
            setTimeout(() => flash.remove(), 150);
          }, 50);
        });

        // Sync with A-Frame's render loop to capture non-cleared WebGL frame
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            try {
              const mergedCanvas = mergeCanvases();
              if (!mergedCanvas) {
                console.error('Could not create merged canvas');
                controls.classList.remove('hidden');
                return;
              }

              const link = document.createElement('a');
              link.href = mergedCanvas.toDataURL('image/png');
              link.download = 'julius-squeezer-' + Date.now() + '.png';
              link.click();
            } catch (e) {
              console.error('Photo error:', e);
            } finally {
              controls.classList.remove('hidden');
            }
          });
        });
      }

      function toggleRecording() {
        startRecording();
      }

      function startRecording() {
        controls.classList.add('hidden');
        recordingControls.classList.add('show');

        isRecording = true;
        recordedChunks = [];
        // Reset and begin on-screen counter tracker
        const timerElement = document.getElementById('recordTimer');
        let totalSeconds = 0;
        timerElement.innerText = "00:00";

        timerInterval = setInterval(() => {
          totalSeconds++;
          const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
          const secs = String(totalSeconds % 60).padStart(2, '0');
          timerElement.innerText = `${mins}:${secs}`;
        }, 1000);

        try {
          const scene = document.querySelector('a-scene');
          const arCanvas = scene.renderer.domElement;

          const recordCanvas = document.createElement('canvas');
          recordCanvas.width = arCanvas.width;
          recordCanvas.height = arCanvas.height;
          const recordCtx = recordCanvas.getContext('2d');

          const canvasStream = recordCanvas.captureStream(30);

          mediaRecorder = new MediaRecorder(canvasStream, {
            mimeType: 'video/webm'
          });

          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              recordedChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'julius-squeezer-' + Date.now() + '.webm';
            link.click();
            URL.revokeObjectURL(url);
          };

          mediaRecorder.start();

          function drawFrame() {
            if (!isRecording) return;
            const mergedCanvas = mergeCanvases();
            if (mergedCanvas) {
              recordCtx.drawImage(mergedCanvas, 0, 0);
            }
            recordingAnimationId = requestAnimationFrame(drawFrame);
          }

          drawFrame();

        } catch (e) {
          console.error('Recording error:', e);
          clearInterval(timerInterval);
          controls.classList.remove('hidden');
          recordingControls.classList.remove('show');
          isRecording = false;
        }
      }

      function stopRecording() {
        isRecording = false;
        cancelAnimationFrame(recordingAnimationId);
        clearInterval(timerInterval);

        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }

        recordingControls.classList.remove('show');
        controls.classList.remove('hidden');
      }
      // ===== END: PHOTO & VIDEO FUNCTIONS =====

      // ===== INITIALIZATION (DO NOT MODIFY) =====
      video.autoplay = true;
      // ===== END: INITIALIZATION =====

      // ===== HIGH-QUALITY CAMERA & AUTOPLAY AUDIO INJECTION (SAFE TO MODIFY) =====
      (function applyMobileQualityFixes() {
        document.addEventListener('DOMContentLoaded', () => {
          video.play().catch(() => {
            const forcePlayOnTouch = () => {
              video.play();
              document.removeEventListener('touchstart', forcePlayOnTouch);
            };
            document.addEventListener('touchstart', forcePlayOnTouch);
          });
        });

        const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = async function(constraints) {
          if (constraints && constraints.video) {
            constraints.video = {
              facingMode: "environment",
              width: { ideal: 1920, min: 1280 },
              height: { ideal: 1080, min: 720 }
            };
          }
          return originalGetUserMedia(constraints);
        };
      })();
    </script>
  </body>
</html>
