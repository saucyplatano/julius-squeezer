
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        transition: opacity 0.3s;
      }
      #controls.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #recordingControls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: none;
      }
      #recordingControls.show {
        display: block;
      }
      button {
        padding: 10px 20px;
        margin: 0 5px;
        font-size: 16px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #45a049;
      }
      button.recording {
        background-color: #f44336;
      }
      button.recording:hover {
        background-color: #da190b;
      }
    </style>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./squeezer.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights, preserveDrawingBuffer: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="squeezerVideo" src="./squeezerVideo.mp4" autoplay loop muted playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#squeezerVideo" position="0 0 0.05" height="0.552" width="1" rotation="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <div id="controls">
      <button onclick="playVideo()">Play</button>
      <button onclick="pauseVideo()">Pause</button>
      <button onclick="takePhoto()">📷 Photo</button>
      <button onclick="toggleRecording()">🔴 Record</button>
    </div>

    <div id="recordingControls">
      <button class="recording" onclick="stopRecording()">⏹️ Stop Recording</button>
    </div>

    <script>
      const video = document.getElementById('squeezerVideo');
      const controls = document.getElementById('controls');
      const recordingControls = document.getElementById('recordingControls');
      let mediaRecorder;
      let recordedChunks = [];
      let isRecording = false;
      let recordingAnimationId;

      function playVideo() {
        video.play();
      }

      function pauseVideo() {
        video.pause();
      }

      // Get the camera video element from MindAR
      function getCameraVideoElement() {
        const videoElement = document.querySelector('[mindar-image-target] a-scene video') || 
                            document.querySelector('video[autoplay]');
        return videoElement;
      }

      // Merge camera feed with AR canvas
      function mergeCanvases() {
        const scene = document.querySelector('a-scene');
        const arCanvas = scene.renderer.domElement;
        
        // Create temporary canvas for merging
        const mergedCanvas = document.createElement('canvas');
        mergedCanvas.width = arCanvas.width;
        mergedCanvas.height = arCanvas.height;
        const ctx = mergedCanvas.getContext('2d');
        
        // Get the camera video stream from MindAR
        // MindAR stores video in the scene's mindar-image component
        const mindArVideo = document.querySelector('[mindar-image-target]')?.parentElement?.querySelector('video') ||
                           Array.from(document.querySelectorAll('video')).find(v => v.srcObject);
        
        // Draw camera feed (or use black if not available)
        if (mindArVideo && mindArVideo.readyState === mindArVideo.HAVE_ENOUGH_DATA) {
          ctx.drawImage(mindArVideo, 0, 0, mergedCanvas.width, mergedCanvas.height);
        } else {
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, mergedCanvas.width, mergedCanvas.height);
        }
        
        // Overlay AR canvas on top
        ctx.drawImage(arCanvas, 0, 0);
        
        return mergedCanvas;
      }

      // Take Photo
      function takePhoto() {
        controls.classList.add('hidden');
        
        setTimeout(() => {
          try {
            const mergedCanvas = mergeCanvases();
            
            const link = document.createElement('a');
            link.href = mergedCanvas.toDataURL('image/png');
            link.download = 'julius-squeezer-' + Date.now() + '.png';
            link.click();
            
            controls.classList.remove('hidden');
          } catch (e) {
            console.error('Photo error:', e);
            controls.classList.remove('hidden');
          }
        }, 100);
      }

      // Toggle Video Recording
      function toggleRecording() {
        startRecording();
      }

      function startRecording() {
        controls.classList.add('hidden');
        recordingControls.classList.add('show');
        
        isRecording = true;
        recordedChunks = [];
        
        try {
          // Create a temporary canvas for recording
          const scene = document.querySelector('a-scene');
          const arCanvas = scene.renderer.domElement;
          
          const recordCanvas = document.createElement('canvas');
          recordCanvas.width = arCanvas.width;
          recordCanvas.height = arCanvas.height;
          
          // Get canvas stream at 30 FPS
          const canvasStream = recordCanvas.captureStream(30);
          
          // Start recording
          mediaRecorder = new MediaRecorder(canvasStream, {
            mimeType: 'video/webm'
          });
          
          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              recordedChunks.push(event.data);
            }
          };
          
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'julius-squeezer-' + Date.now() + '.webm';
            link.click();
            URL.revokeObjectURL(url);
          };
          
          mediaRecorder.start();
          
          // Continuously draw merged frames to canvas
          const ctx = recordCanvas.getContext('2d');
          
          function drawFrame() {
            if (!isRecording) return;
            
            const mergedCanvas = mergeCanvases();
            ctx.drawImage(mergedCanvas, 0, 0);
            
            recordingAnimationId = requestAnimationFrame(drawFrame);
          }
          
          drawFrame();
          
        } catch (e) {
          console.error('Recording error:', e);
          alert('Could not start recording: ' + e.message);
          controls.classList.remove('hidden');
          recordingControls.classList.remove('show');
          isRecording = false;
        }
      }

      function stopRecording() {
        isRecording = false;
        cancelAnimationFrame(recordingAnimationId);
        
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        
        recordingControls.classList.remove('show');
        controls.classList.remove('hidden');
      }

      video.autoplay = true;
    </script>
  </body>
</html>
