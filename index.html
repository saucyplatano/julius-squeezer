<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        transition: opacity 0.3s;
      }
      #controls.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #recordingControls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: none;
      }
      #recordingControls.show {
        display: block;
      }
      button {
        padding: 10px 20px;
        margin: 0 5px;
        font-size: 16px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #45a049;
      }
      button.recording {
        background-color: #f44336;
      }
      button.recording:hover {
        background-color: #da190b;
      }
    </style>
  </head>
  <body>
    <!-- Fixed A-Frame scene initialization parameters -->
    <a-scene mindar-image="imageTargetSrc: ./squeezer.mind;" color-space="sRGB" renderer="colorManagement: true; preserveDrawingBuffer: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="squeezerVideo" src="./squeezerVideo.mp4" autoplay loop muted playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <a-plane src="#squeezerVideo" position="0 0 0.05" height="0.552" width="1" rotation="0 0 0"></a-plane>
      
    </a-scene>

    <div id="controls">
      <button onclick="playVideo()">Play</button>
      <button onclick="pauseVideo()">Pause</button>
      <button onclick="takePhoto()">📷 Photo</button>
      <button onclick="toggleRecording()">🔴 Record</button>
    </div>

    <div id="recordingControls">
      <button class="recording" onclick="stopRecording()">⏹️ Stop Recording</button>
    </div>

    <script>
      const video = document.getElementById('squeezerVideo');
const controls = document.getElementById('controls');
const recordingControls = document.getElementById('recordingControls');

let mediaRecorder;
let recordedChunks = [];
let isRecording = false;

// Optimize mobile memory allocations by creating one reusable canvas
const captureCanvas = document.createElement('canvas');
const captureCtx = captureCanvas.getContext('2d');

function playVideo() {
  video.play();
}

function pauseVideo() {
  video.pause();
}

// Robust target locator finding MindAR's dynamic device stream feed
function getMindARVideo() {
  return Array.from(document.querySelectorAll('body > video, video'))
    .find(v => v.srcObject !== null && v.id !== 'squeezerVideo');
}

// One master merging routine to compose layers flawlessly
function composeActiveARFrame(targetCtx, targetWidth, targetHeight) {
  const sceneEl = document.querySelector('a-scene');
  const webglCanvas = sceneEl.canvas;
  const cameraVideo = getMindARVideo();

  // Clear workspace
  targetCtx.clearRect(0, 0, targetWidth, targetHeight);

  // Layer 1: Draw live hardware device camera environment track
  if (cameraVideo && cameraVideo.readyState >= 2) {
    targetCtx.drawImage(cameraVideo, 0, 0, targetWidth, targetHeight);
  } else {
    targetCtx.fillStyle = '#000000';
    targetCtx.fillRect(0, 0, targetWidth, targetHeight);
  }

  // Layer 2: Draw current foreground WebGL 3D elements
  if (webglCanvas) {
    targetCtx.drawImage(webglCanvas, 0, 0, targetWidth, targetHeight);
  }
}

// 📷 High-Speed Mobile Photo Capture Component Injection
function takePhoto() {
  controls.classList.add('hidden');
  const sceneEl = document.querySelector('a-scene');

  // We temporarily register a component to catch the render execution frame 
  // exactly when pixels exist on the thread before they get auto-wiped.
  sceneEl.addEventListener('render-target-loaded', function captureHook() {
    try {
      const cameraVideo = getMindARVideo();
      const webglCanvas = sceneEl.canvas;

      const outputWidth = cameraVideo ? cameraVideo.videoWidth : webglCanvas.width;
      const outputHeight = cameraVideo ? cameraVideo.videoHeight : webglCanvas.height;

      captureCanvas.width = outputWidth;
      captureCanvas.height = outputHeight;

      composeActiveARFrame(captureCtx, outputWidth, outputHeight);

      const link = document.createElement('a');
      link.href = captureCanvas.toDataURL('image/jpeg', 0.95);
      link.download = 'ar-capture-' + Date.now() + '.jpg';
      link.click();
    } catch (err) {
      console.error('Mobile Photo Error:', err);
    } finally {
      controls.classList.remove('hidden');
    }
  }, { once: true }); // Instantly tears down to prevent tracking lag

  // Direct A-Frame components to cycle an immediate forced layout updates recalculation
  if(sceneEl.renderer) {
     sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
     sceneEl.emit('render-target-loaded');
  }
}

// 🔴 High-Efficiency Video Recorder System Hook
function toggleRecording() {
  startRecording();
}

function startRecording() {
  controls.classList.add('hidden');
  recordingControls.classList.add('show');
  
  isRecording = true;
  recordedChunks = [];

  try {
    const sceneEl = document.querySelector('a-scene');
    const cameraVideo = getMindARVideo();
    const webglCanvas = sceneEl.canvas;

    const width = cameraVideo ? cameraVideo.videoWidth : webglCanvas.width;
    const height = cameraVideo ? cameraVideo.videoHeight : webglCanvas.height;

    const recordCanvas = document.createElement('canvas');
    recordCanvas.width = width;
    recordCanvas.height = height;
    const recordCtx = recordCanvas.getContext('2d');

    // Synchronize frame grabs into A-Frame's animation engine scheduler loop.
    // This allows captureStream to pull active drawing contexts with zero black screens.
    AFRAME.registerComponent('recording-listener', {
      tick: function () {
        if (!isRecording) return;
        composeActiveARFrame(recordCtx, width, height);
      }
    });
    
    // Attach listener dynamically
    sceneEl.setAttribute('recording-listener', '');

    const stream = recordCanvas.captureStream(30);
    
    // Handle container compression options automatically for iOS vs Android devices
    const codecString = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
    const extension = codecString === 'video/mp4' ? 'mp4' : 'webm';

    mediaRecorder = new MediaRecorder(stream, { mimeType: codecString });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      // Safely detach tracking context loops
      sceneEl.removeAttribute('recording-listener');
      delete AFRAME.components['recording-listener'];

      const blob = new Blob(recordedChunks, { type: codecString });
      const videoUrl = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = videoUrl;
      link.download = 'ar-video-' + Date.now() + '.' + extension;
      link.click();
      URL.revokeObjectURL(videoUrl);
    };

    mediaRecorder.start();

  } catch (err) {
    console.error('Recording initialization failure:', err);
    alert('Failed to initialize video recording on this mobile device.');
    controls.classList.remove('hidden');
    recordingControls.classList.remove('show');
    isRecording = false;
  }
}

function stopRecording() {
  isRecording = false;
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  recordingControls.classList.remove('show');
  controls.classList.remove('hidden');
}

video.autoplay = true;
    </script>
  </body>
</html>
