<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MindAR WebAR Experience</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        touch-action: manipulation;
      }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        transition: opacity 0.3s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #controls.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #recordingControls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: none;
      }
      #recordingControls.show {
        display: block;
      }
      button {
        padding: 10px 16px;
        font-size: 15px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      button:hover {
        background-color: #45a049;
      }
      button.recording {
        background-color: #f44336;
      }
      button.recording:hover {
        background-color: #da190b;
      }

      /* Camera Shutter Flash Effect Overlay */
      #flash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease-out;
      }

      /* Live Recording Timer Text */
      #recordTimer {
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
        vertical-align: middle;
        margin-left: 8px;
        display: inline-block;
        font-variant-numeric: tabular-nums;
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 6px;
        border-radius: 3px;
      }

      /* Intro Video Overlay Styling */
      #introOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.6s ease;
      }

      #introOverlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #introVideo {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #skipIntroBtn {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 2001;
        background: rgba(0, 0, 0, 0.5);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 14px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        transition: background-color 0.2s;
      }

      #skipIntroBtn:hover {
        background: rgba(0, 0, 0, 0.8);
      }

      /* Zoom Level Indicator */
      #zoomIndicator {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-family: sans-serif;
        font-size: 13px;
        padding: 4px 12px;
        border-radius: 12px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #zoomIndicator.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="introOverlay">
      <video id="introVideo" src="./globalvisionintro.mp4" autoplay muted playsinline></video>
      <button id="skipIntroBtn" onclick="closeIntro(event)">Skip ⏭</button>
    </div>

    <!-- Zoom level notification pill -->
    <div id="zoomIndicator">1.0x</div>

    <!-- ===== DO NOT MODIFY THIS SECTION ===== -->
    <a-scene
      mindar-image="imageTargetSrc: ./squeezer.mind;"
      color-space="sRGB"
      renderer="preserveDrawingBuffer: true; toneMapping: no; colorManagement: false;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="squeezerVideo" src="./squeezerVideo.mp4" autoplay loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera id="mainCamera" position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
        <a-plane src="#squeezerVideo" position="0 0 0.05" height="0.552" width="1" rotation="0 0 0" material="shader: flat; toneMapped: false;"></a-plane>
      </a-entity>
    </a-scene>
    <!-- ===== END: DO NOT MODIFY ===== -->

    <div id="controls" class="hidden">
      <button onclick="changeZoom(-0.25)" title="Zoom Out">🔍-</button>
      <button onclick="changeZoom(0.25)" title="Zoom In">🔍+</button>
      <button id="playPauseBtn" onclick="toggleVideo()">⏸ Pause</button>
      <button onclick="takePhoto()">📷 Photo</button>
      <button onclick="toggleRecording()">🔴 Record</button>
    </div>

    <div id="recordingControls">
      <button class="recording" onclick="stopRecording()">
        ⏹️ Stop Recording <span id="recordTimer">00:00</span>
      </button>
    </div>

    <script>
      (function applyHighQualityCameraConstraints() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
          navigator.mediaDevices.getUserMedia = async function(constraints) {
            if (constraints && constraints.video) {
              constraints.video = {
                facingMode: "environment",
                width: { ideal: 1920, min: 1280 },
                height: { ideal: 1080, min: 720 }
              };
            }
            return originalGetUserMedia(constraints);
          };
        }
      })();

      const video = document.getElementById('squeezerVideo');
      const introVideo = document.getElementById('introVideo');
      const introOverlay = document.getElementById('introOverlay');
      const controls = document.getElementById('controls');
      const recordingControls = document.getElementById('recordingControls');
      const targetEntity = document.getElementById('targetEntity');
      const mainCamera = document.getElementById('mainCamera');
      const zoomIndicator = document.getElementById('zoomIndicator');

      let mediaRecorder;
      let recordedChunks = [];
      let isRecording = false;
      let recordingAnimationId;
      let timerInterval;
      let introClosed = false;

      // Unmute video stream on user gesture
      function enableAudio() {
        if (video) {
          video.muted = false;
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(err => {
              console.log('Audio unblock deferred:', err);
            });
          }
        }
      }

      window.addEventListener('click', enableAudio);
      window.addEventListener('touchstart', enableAudio);

      function closeIntro(e) {
        if (e && e.stopPropagation) {
          e.stopPropagation();
        }
        if (introClosed) return;
        introClosed = true;

        enableAudio();

        introOverlay.classList.add('fade-out');
        setTimeout(() => {
          if (introVideo) introVideo.pause();
          introOverlay.style.display = 'none';
          controls.classList.remove('hidden');
        }, 600);
      }

      if (introVideo) {
        introVideo.addEventListener('ended', closeIntro);
        introVideo.play().catch(() => {
          console.log('Waiting for interaction to play intro.');
        });
      }

      let currentZoom = 1.0;
      const minZoom = 1.0;
      const maxZoom = 4.0;
      let zoomTimeout;

      function showZoomPill(val) {
        zoomIndicator.innerText = `${val.toFixed(1)}x`;
        zoomIndicator.classList.add('show');
        clearTimeout(zoomTimeout);
        zoomTimeout = setTimeout(() => {
          zoomIndicator.classList.remove('show');
        }, 1500);
      }

      function applyZoom(newZoom) {
        currentZoom = Math.min(Math.max(newZoom, minZoom), maxZoom);
        showZoomPill(currentZoom);

        // 1. Hardware WebRTC Zoom (Android Chrome)
        const mindArVideo = getMindARVideo();
        if (mindArVideo && mindArVideo.srcObject) {
          const track = mindArVideo.srcObject.getVideoTracks()[0];
          if (track) {
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.zoom) {
              const targetZoom = capabilities.min + (currentZoom - 1) * ((capabilities.max - capabilities.min) / (maxZoom - 1));
              track.applyConstraints({ advanced: [{ zoom: targetZoom }] }).catch(() => {});
            }
          }
        }

        // 2. A-Frame Camera FOV Zoom Fallback (Works on iOS Safari & everywhere)
        if (mainCamera) {
          const defaultFov = 80;
          const targetFov = defaultFov / currentZoom;
          mainCamera.setAttribute('camera', 'fov', targetFov);
        }
      }

      function changeZoom(delta) {
        applyZoom(currentZoom + delta);
      }

      // Pinch-to-zoom gesture event handling
      let initialDistance = null;
      let startZoom = 1.0;

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialDistance = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          startZoom = currentZoom;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialDistance) {
          const currentDistance = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          const factor = currentDistance / initialDistance;
          applyZoom(startZoom * factor);
        }
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialDistance = null;
        }
      }, { passive: true });

      if (video) {
        video.addEventListener('play', () => {
          const btn = document.getElementById('playPauseBtn');
          if (btn) btn.innerText = "⏸ Pause";
        });
        video.addEventListener('pause', () => {
          const btn = document.getElementById('playPauseBtn');
          if (btn) btn.innerText = "▶ Play";
        });
      }

      if (targetEntity) {
        targetEntity.addEventListener('targetFound', () => {
          if (video) {
            video.muted = false;
            video.play().catch(e => console.log('Target found play defer:', e));
          }
        });
      }

      function toggleVideo() {
        if (!video) return;
        video.muted = false;
        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
      }

      function getMindARVideo() {
        return Array.from(document.querySelectorAll('video')).find(v => v.srcObject !== null && v.id !== 'squeezerVideo');
      }

      function mergeCanvases() {
        try {
          const scene = document.querySelector('a-scene');
          if (!scene || !scene.renderer) return null;

          const arCanvas = scene.renderer.domElement;
          const mindArVideo = getMindARVideo();

          const mergedCanvas = document.createElement('canvas');
          mergedCanvas.width = arCanvas.width;
          mergedCanvas.height = arCanvas.height;
          const ctx = mergedCanvas.getContext('2d');

          if (mindArVideo && mindArVideo.readyState === mindArVideo.HAVE_ENOUGH_DATA) {
            const vWidth = mindArVideo.videoWidth;
            const vHeight = mindArVideo.videoHeight;
            const targetRatio = arCanvas.width / arCanvas.height;
            const videoRatio = vWidth / vHeight;

            let drawWidth, drawHeight, offsetX, offsetY;

            if (videoRatio > targetRatio) {
              drawHeight = arCanvas.height;
              drawWidth = arCanvas.height * videoRatio;
              offsetX = (arCanvas.width - drawWidth) / 2;
              offsetY = 0;
            } else {
              drawWidth = arCanvas.width;
              drawHeight = arCanvas.width / videoRatio;
              offsetX = 0;
              offsetY = (arCanvas.height - drawHeight) / 2;
            }

            ctx.drawImage(mindArVideo, offsetX, offsetY, drawWidth, drawHeight);
          } else {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, mergedCanvas.width, mergedCanvas.height);
          }

          ctx.drawImage(arCanvas, 0, 0);
          return mergedCanvas;
        } catch (e) {
          console.error('Merge error:', e);
          return null;
        }
      }

      function takePhoto() {
        controls.classList.add('hidden');

        const flash = document.createElement('div');
        flash.id = 'flash-overlay';
        document.body.appendChild(flash);
        requestAnimationFrame(() => {
          flash.style.opacity = '1';
          setTimeout(() => {
            flash.style.opacity = '0';
            setTimeout(() => flash.remove(), 150);
          }, 50);
        });

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            try {
              const mergedCanvas = mergeCanvases();
              if (mergedCanvas) {
                const link = document.createElement('a');
                link.href = mergedCanvas.toDataURL('image/png');
                link.download = 'julius-squeezer-' + Date.now() + '.png';
                link.click();
              }
            } catch (e) {
              console.error('Photo error:', e);
            } finally {
              controls.classList.remove('hidden');
            }
          });
        });
      }

      function toggleRecording() {
        startRecording();
      }

      function startRecording() {
        controls.classList.add('hidden');
        recordingControls.classList.add('show');

        isRecording = true;
        recordedChunks = [];
        
        const timerElement = document.getElementById('recordTimer');
        let totalSeconds = 0;
        timerElement.innerText = "00:00";

        timerInterval = setInterval(() => {
          totalSeconds++;
          const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
          const secs = String(totalSeconds % 60).padStart(2, '0');
          timerElement.innerText = `${mins}:${secs}`;
        }, 1000);

        try {
          const scene = document.querySelector('a-scene');
          const arCanvas = scene.renderer.domElement;

          const recordCanvas = document.createElement('canvas');
          recordCanvas.width = arCanvas.width;
          recordCanvas.height = arCanvas.height;
          const recordCtx = recordCanvas.getContext('2d');

          const canvasStream = recordCanvas.captureStream(30);

          mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              recordedChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'julius-squeezer-' + Date.now() + '.webm';
            link.click();
            URL.revokeObjectURL(url);
          };

          mediaRecorder.start();

          function drawFrame() {
            if (!isRecording) return;
            const mergedCanvas = mergeCanvases();
            if (mergedCanvas) {
              recordCtx.drawImage(mergedCanvas, 0, 0);
            }
            recordingAnimationId = requestAnimationFrame(drawFrame);
          }

          drawFrame();

        } catch (e) {
          console.error('Recording error:', e);
          clearInterval(timerInterval);
          controls.classList.remove('hidden');
          recordingControls.classList.remove('show');
          isRecording = false;
        }
      }

      function stopRecording() {
        isRecording = false;
        cancelAnimationFrame(recordingAnimationId);
        clearInterval(timerInterval);

        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }

        recordingControls.classList.remove('show');
        controls.classList.remove('hidden');
      }
    </script>
  </body>
</html>
