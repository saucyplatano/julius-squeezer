<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #debug { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 10px; font-family: monospace; z-index: 100; }
    </style>
  </head>
  <body>
    <div id="debug">Loading...</div>
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/saucyplatano/julius-squeezer@main/targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane color="blue" opacity="0.5" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      document.querySelector('a-scene').addEventListener('loaded', () => {
        document.getElementById('debug').textContent = 'Scene loaded!';
      });
      document.querySelector('a-scene').addEventListener('error', (e) => {
        document.getElementById('debug').textContent = 'Error: ' + e.detail.message;
        console.error('Scene error:', e);
      });
      window.addEventListener('error', (e) => {
        console.error('Script error:', e);
      });
    </script>
  </body>
</html>
